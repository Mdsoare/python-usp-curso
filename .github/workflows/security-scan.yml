name: DevSecOps Unified Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. SAST - CodeQL (Python)
  # ---------------------------------------------------------------------------
  sast-codeql:
    name: SAST (CodeQL Analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: CodeQL Initialization
        uses: github/codeql-action/init@v4
        with:
          languages: 'python'
          # Utiliza a query suite padrão otimizada para segurança
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  # ---------------------------------------------------------------------------
  # 2. SCA - OSV-Scanner (Multilinguagem: pip, etc.)
  # ---------------------------------------------------------------------------
  sca-osv:
    name: SCA (OSV-Scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.0
    permissions:
      contents: read
      security-events: write